[project]
name = "coder3d-mesh"
version = "0.1.0"
description = "3D-Coder mesh inspection/repair/render MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "trimesh>=5.0.0",
  "networkx>=3",
  "pymeshlab>=2025.7.post1",
  "open3d>=0.19.0",
  "numpy>=2.5.2",
  "fastmcp>=3.4.7",
  "pillow>=10",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coder3d_mesh"]
