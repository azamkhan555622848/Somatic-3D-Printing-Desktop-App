[project]
name = "coder3d-claude"
version = "0.1.0"
description = "3D-Coder delegate adapter: route design tasks to Claude Code (Max subscription) headlessly"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastmcp>=3.4.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coder3d_claude"]
