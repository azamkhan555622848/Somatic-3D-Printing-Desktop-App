# Build Somatic for Windows, Linux and macOS, and publish a release on a tag.
#
#   git tag v0.1.0-alpha && git push origin v0.1.0-alpha
#
# A manual run (workflow_dispatch) builds and uploads artifacts without
# publishing, which is the way to check a change before tagging it.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # A newer run supersedes an older one on the same ref. Without this, one
  # job waiting on a scarce runner held every later run at "pending".
  cancel-in-progress: true

env:
  # Only the dev channel bundles the opencode-cli sidecar, so it is the only
  # channel whose package starts (see RELEASING.md). It is set explicitly
  # because one build script otherwise reads the channel from the current git
  # branch, and a tag checkout has no branch.
  OPENCODE_CHANNEL: dev

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: opencode-dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck the app
        run: bunx tsc --noEmit -p packages/app/tsconfig.json
      - name: App unit tests
        run: bun run test:unit
        working-directory: opencode-dev/packages/app
      - name: Desktop unit tests
        run: bun test src/main/coder3d/
        working-directory: opencode-dev/packages/desktop

  build:
    name: Package ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win,   label: Windows x64,          root: "D:/s" }
          - { os: ubuntu-latest,  target: linux, label: Linux x64,            root: s }
          - { os: macos-14,       target: mac,   label: macOS Apple Silicon,  root: s }
          # macos-13 is retired and never gets a runner. Intel Macs are the
          # minority in a lab, so this leg is allowed to fail without blocking
          # the release; the other three installers still publish.
          - { os: macos-15-intel, target: mac,   label: macOS Intel,          root: s, optional: true }
    env:
      # No signing certificate in this repository: skip the lookup rather than
      # fail on it. Windows signing already skips itself without Azure secrets.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # electron-vite inlines packages/opencode's 460k-line node bundle into the
      # main process. On the 7 GB macOS runners Node's default heap is too
      # small for that and the build dies with an out-of-memory abort.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        if: runner.os != 'Windows'
        with:
          path: s
      # Windows gets a plain clone into D:\s instead. The runner's workspace
      # repeats the repository name, and bun's isolated node_modules layout on
      # top of that pushed a native build past the 260-character path limit
      # (MSVC C1258). Long-paths mode did not satisfy that compiler, and a
      # subst drive crashed bun itself, so the checkout simply lives somewhere
      # short. The clone fetches exactly the commit this run is for.
      - name: Clone into a short path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git init -q D:/s
          git -C D:/s remote add origin "https://github.com/${{ github.repository }}"
          git -C D:/s fetch -q --depth 1 origin "${{ github.sha }}"
          git -C D:/s checkout -q FETCH_HEAD
          git -C D:/s log -1 --oneline
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm fakeroot
      - run: bun install --frozen-lockfile
        working-directory: ${{ matrix.root }}/opencode-dev
      # `build` runs the prebuild, which downloads this platform's sidecar.
      - name: Build
        run: bun run build
        working-directory: ${{ matrix.root }}/opencode-dev/packages/desktop
      - name: Package
        run: bun run package:${{ matrix.target }}
        working-directory: ${{ matrix.root }}/opencode-dev/packages/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: somatic-${{ matrix.os }}
          if-no-files-found: error
          path: |
            ${{ matrix.root }}/opencode-dev/packages/desktop/dist/somatic-*
            !${{ matrix.root }}/opencode-dev/packages/desktop/dist/*.blockmap

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "Somatic ${{ github.ref_name }}" \
            --generate-notes \
            --prerelease
