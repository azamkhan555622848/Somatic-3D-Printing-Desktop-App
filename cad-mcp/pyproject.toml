[project]
name = "coder3d-cad"
version = "0.1.0"
description = "3D-Coder CAD runner + MCP server (build123d)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "build123d>=0.11.1",
  "trimesh>=5.0.0",
  "numpy>=2.5.2",
  "fastmcp>=3.4.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coder3d_cad"]
